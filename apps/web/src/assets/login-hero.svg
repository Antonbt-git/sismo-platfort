<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960" role="img" aria-label="Registro sismografico con epicentro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131d45"/>
      <stop offset="55%" stop-color="#1b2a5e"/>
      <stop offset="100%" stop-color="#2a3b8a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="epiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8981fb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8981fb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="720" height="960" fill="url(#bg)"/>
  <rect width="720" height="960" fill="url(#grid)"/>

  <!-- Epicentro: ondas concentricas -->
  <g transform="translate(520 250)">
    <circle r="150" fill="url(#epiGlow)"/>
    <g fill="none" stroke="#8981fb">
      <circle r="46" stroke-opacity="0.85" stroke-width="1.6">
        <animate attributeName="r" values="46;64;46" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.85;0.15;0.85" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="92" stroke-opacity="0.5" stroke-width="1.3">
        <animate attributeName="r" values="92;124;92" dur="3.4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.08;0.5" dur="3.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" stroke-opacity="0.28" stroke-width="1.1">
        <animate attributeName="r" values="140;184;140" dur="3.4s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.28;0.05;0.28" dur="3.4s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle r="7" fill="#8981fb"/>
    <circle r="13" fill="none" stroke="#8981fb" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>

  <!-- Sombra suave bajo la traza -->
  <polyline
    points="40,600 60,594 80,606 100,597 120,603 140,595 160,608 180,599 200,602 220,593 240,607 260,600 280,596 300,605 320,598 340,601 350,570 360,630 370,530 380,690 390,470 400,760 410,400 420,850 430,330 440,930 450,290 460,900 470,340 480,840 490,420 500,750 510,490 520,690 530,560 540,640 560,575 580,635 600,585 620,625 640,595 660,615 680,600"
    fill="none" stroke="#8981fb" stroke-opacity="0.28" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Trazado sismografico -->
  <polyline
    points="40,600 60,594 80,606 100,597 120,603 140,595 160,608 180,599 200,602 220,593 240,607 260,600 280,596 300,605 320,598 340,601 350,570 360,630 370,530 380,690 390,470 400,760 410,400 420,850 430,330 440,930 450,290 460,900 470,340 480,840 490,420 500,750 510,490 520,690 530,560 540,640 560,575 580,635 600,585 620,625 640,595 660,615 680,600"
    fill="none" stroke="#aaa5ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Eje de referencia -->
  <line x1="40" y1="600" x2="680" y2="600" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- Marcas de tiempo del registro -->
  <g fill="#ffffff" fill-opacity="0.35" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1">
    <text x="44" y="640">-60s</text>
    <text x="344" y="640">-30s</text>
    <text x="644" y="640">0s</text>
  </g>

  <!-- Viñeta -->
  <rect width="720" height="960" fill="url(#vignette)"/>
</svg>
