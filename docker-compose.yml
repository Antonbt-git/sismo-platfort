services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sismo
      POSTGRES_PASSWORD: sismo
      POSTGRES_DB: sismodb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismo -d sismodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sismo:sismo@db:5432/sismodb
    ports:
      - "8000:8000"
    volumes:
      - ./var:/app/var
    depends_on:
      db:
        condition: service_healthy

  ingesta:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sismo:sismo@db:5432/sismodb
    command: ["python", "-m", "ingestion.sync", "--loop"]
    volumes:
      - ./var:/app/var
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
